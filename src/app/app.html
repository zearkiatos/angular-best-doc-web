<mat-sidenav-container class="mat-container">
  <mat-sidenav #sideNavbar class="mat-sidenavLeft" mode="over">
    <h1 id="identity">
      <a routerLink="/">
        <span>&nbsp;</span>
        <strong>BestDoc</strong>
      </a>
    </h1>
    <nav class="navbar">
      <ul class="navbar-nav">
        <li class="navbar-item selected">
          <a routerLink="/" class="nav-link">
            <span class="icon-home">Home</span>
          </a>
        </li>
        <li class="navbar-item">
          <a routerLink="/documents" class="nav-link">
            Document List
          </a>
        </li>
        <li class="navbar-item">
          <a routerLink="/documents/new" class="nav-link">
            Upload Documents
          </a>
        </li>
      </ul>
    </nav>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar>
      <mat-toolbar-row>
        <button id="openMenu" class="navbar-toggler btn-info" (click)="sideNavbar.toggle()">
          <span class="navbar-toggler-icon"></span>
        </button>
        <h2>Walmart ☀️</h2>
        <span class="toolbar-middle-space"></span>
        <span id="openSidebar" class="btn" (click)="drawerRight.toggle()">
          Pedro Capriles
          <span class="icon-user">

          </span>
        </span>
      </mat-toolbar-row>
      <mat-toolbar-row>
        <h3>{{title()}}</h3>
      </mat-toolbar-row>
    </mat-toolbar>
    <router-outlet></router-outlet>
  </mat-sidenav-content>
  <mat-sidenav #drawerRight class="mat-sidenavRight" position="end" mode="push">
    <p>Sidenav right</p>
  </mat-sidenav>
</mat-sidenav-container>
<app-best-doc-footer></app-best-doc-footer>
