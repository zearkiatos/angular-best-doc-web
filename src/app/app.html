<mat-sidenav-container class="mat-container">
  <mat-sidenav #sideNavbar class="mat-sidenavLeft" mode="over">
    <h1 id="identity">
      <a routerLink="/">
        <span>&nbsp;</span>
        <strong>BestDoc</strong>
      </a>
    </h1>
    <nav>
      <ul>
        <li>
          <a routerLink="/">
            Home
          </a>
        </li>
        <li>
          <a routerLink="/documents">
            Document List
          </a>
        </li>
        <li>
          <a routerLink="/documents/new">
            Upload Documents
          </a>
        </li>
      </ul>
    </nav>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar>
      <mat-toolbar-row>
        <button id="openMenu" class="btn btn-danger" (click)="sideNavbar.toggle()">Open</button>
        <h2>Company's name</h2>
        <span class="toolbar-middle-space"></span>
        <button id="openSidebar" class="btn" (click)="drawerRight.toggle()">User</button>
      </mat-toolbar-row>
      <mat-toolbar-row>
        <h2>{{title()}}</h2>
      </mat-toolbar-row>
    </mat-toolbar>
    <router-outlet></router-outlet>
  </mat-sidenav-content>
  <mat-sidenav #drawerRight class="mat-sidenavRight" position="end" mode="push">
    <p>Sidenav right</p>
  </mat-sidenav>
</mat-sidenav-container>
<app-best-doc-footer></app-best-doc-footer>
