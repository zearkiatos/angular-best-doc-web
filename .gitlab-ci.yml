image: node:24-alpine

stages:
  - build
  - deploy

variables:
  NODE_ENV: production
  CI: "true"
  NG_CLI_ANALYTICS: "false"

build:docker_and_npm:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  cache:
    paths:
      - node_modules/
  script:
    # Instalar Node.js en contenedor Docker para build Angular
    - apk add --no-cache nodejs npm

    # Instalar dependencias
    - npm ci
    - npm install -g @angular/cli

    # Crear .env con variables de CI
    - touch .env
    - echo "NODE_ENV=${NODE_ENV}" > .env
    - echo "CI=${CI}" >> .env
    - echo "NG_CLI_ANALYTICS=${NG_CLI_ANALYTICS}" >> .env
    - echo "PORT=${PORT:-4200}" >> .env
    - echo "ENABLE_CONSOLE_LOG=${ENABLE_CONSOLE_LOG:-false}" >> .env
    - echo "LOG_LEVEL=${LOG_LEVEL:-info}" >> .env
    - echo "BASE_PATH=${BASE_PATH:-/}" >> .env

    # Build Docker image
    - echo "Building Docker image 🐳"
    - docker build . -t=angular-best-doc-web:gitlab-${CI_PIPELINE_IID}

    # Build Angular app
    - echo "Building Angular app 🛠"
    - npm run build
  artifacts:
    expire_in: 1 day
    paths:
      - dist/angular-best-doc-web/browser/
  only:
    - merge_requests
    - main

pages:
  stage: deploy
  image: node:24-alpine
  dependencies:
    - build:docker_and_npm
  script:
    - echo "Deploying to GitLab Pages 🚀"
    - mkdir -p public
    - cp -r dist/angular-best-doc-web/browser/* public/
    - cp public/index.html public/404.html
  artifacts:
    paths:
      - public
  environment:
    name: production
    url: https://$CI_PROJECT_NAMESPACE.gitlab.io/$CI_PROJECT_NAME/
  only:
    - main
